<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #111111;
      }
      body {
        font-family: "Montserrat", sans-serif;
      }
      #zoom {
        position: absolute;
        inset: 0;
        transform-origin: 50% 32%;
        z-index: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="41.6"
      data-width="1080"
      data-height="1920"
    >
      <!-- Cámara: el wrapper #zoom hace los zoom in / zoom out; el video no se toca -->
      <div id="zoom">
        <video
          id="a-roll"
          class="clip"
          src="assets/gabo-planes.mp4"
          playsinline
          data-start="0"
          data-duration="39.6"
          data-track-index="0"
          data-has-audio="true"
          style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"
        ></video>
      </div>

      <!-- Hook del inicio: "Si entrenas solo, lo vas a dejar" -->
      <div
        id="hook"
        class="clip"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="2.3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="position: absolute; inset: 0; z-index: 3"
      ></div>

      <!-- Motion graphics: cómo funciona el plan panitas -->
      <div
        id="plan-panitas"
        class="clip"
        data-composition-id="plan-panitas"
        data-composition-src="compositions/plan-panitas.html"
        data-start="8.13"
        data-duration="13.9"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="position: absolute; inset: 0; z-index: 3"
      ></div>

      <!-- Motion graphics: cómo funciona el plan familiar -->
      <div
        id="plan-familiar"
        class="clip"
        data-composition-id="plan-familiar"
        data-composition-src="compositions/plan-familiar.html"
        data-start="22.13"
        data-duration="14.5"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="position: absolute; inset: 0; z-index: 3"
      ></div>

      <!-- Cierre: "es Gabofit, llévatelo" + golpe a la pantalla y placa final -->
      <div
        id="cierre"
        class="clip"
        data-composition-id="cierre"
        data-composition-src="compositions/cierre.html"
        data-start="37.4"
        data-duration="4.2"
        data-track-index="3"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="position: absolute; inset: 0; z-index: 3"
      ></div>

      <!-- Subtítulos: Montserrat Bold, verde, mayúsculas -->
      <div
        id="subtitulos"
        class="clip"
        data-composition-id="subtitulos"
        data-composition-src="compositions/subtitulos.html"
        data-start="0"
        data-duration="39.6"
        data-track-index="4"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
        style="position: absolute; inset: 0; z-index: 4"
      ></div>

      <!-- Swish en cada cambio de toma (el pico del sonido cae 1 frame después del corte) -->
      <audio id="swish-toma2" class="clip" src="assets/sfx/swish-1.wav" data-start="1.97" data-duration="0.55" data-track-index="5" data-volume="0.5"></audio>
      <audio id="swish-toma3" class="clip" src="assets/sfx/swish-2.wav" data-start="7.91" data-duration="0.5" data-track-index="5" data-volume="0.5"></audio>
      <audio id="swish-toma4" class="clip" src="assets/sfx/swish-3.wav" data-start="21.85" data-duration="0.6" data-track-index="5" data-volume="0.5"></audio>
      <!-- Swish de la marca al cierre y golpe cuando aterriza el precio de $120 -->
      <audio id="swish-marca" class="clip" src="assets/sfx/swish-4.wav" data-start="37.45" data-duration="0.45" data-track-index="6" data-volume="0.4"></audio>
      <audio id="golpe-120" class="clip" src="assets/sfx/golpe.wav" data-start="33.29" data-duration="0.35" data-track-index="9" data-volume="0.55"></audio>
      <!-- Plan panitas: barrido al entrar la tarjeta, pop en cada pieza, golpe en cada precio -->
      <audio id="pn-entra" class="clip" src="assets/sfx/barrido-1.wav" data-start="8.47" data-duration="0.32" data-track-index="7" data-volume="0.3"></audio>
      <audio id="sfx-pn-tu" class="clip" src="assets/sfx/pop-1.wav" data-start="8.65" data-duration="0.09" data-track-index="8" data-volume="0.35"></audio>
      <audio id="sfx-pn-pana1" class="clip" src="assets/sfx/pop-2.wav" data-start="9.13" data-duration="0.09" data-track-index="9" data-volume="0.35"></audio>
      <audio id="sfx-pn-pana2" class="clip" src="assets/sfx/pop-3.wav" data-start="9.33" data-duration="0.09" data-track-index="8" data-volume="0.35"></audio>
      <audio id="sfx-pn-chip-plan" class="clip" src="assets/sfx/pop-1.wav" data-start="10.91" data-duration="0.09" data-track-index="9" data-volume="0.35"></audio>
      <audio id="sfx-pn-chip-3" class="clip" src="assets/sfx/pop-2.wav" data-start="11.25" data-duration="0.09" data-track-index="8" data-volume="0.35"></audio>
      <audio id="pn-golpe-100" class="clip" src="assets/sfx/golpe.wav" data-start="12.29" data-duration="0.35" data-track-index="9" data-volume="0.55"></audio>
      <audio id="sfx-pn-bcv" class="clip" src="assets/sfx/pop-3.wav" data-start="13.23" data-duration="0.09" data-track-index="8" data-volume="0.25"></audio>
      <audio id="sfx-pn-120" class="clip" src="assets/sfx/pop-1.wav" data-start="14.61" data-duration="0.09" data-track-index="8" data-volume="0.35"></audio>
      <audio id="pn-tachado" class="clip" src="assets/sfx/barrido-2.wav" data-start="16.71" data-duration="0.3" data-track-index="7" data-volume="0.3"></audio>
      <audio id="sfx-pn-menos20" class="clip" src="assets/sfx/pop-2.wav" data-start="17.11" data-duration="0.09" data-track-index="8" data-volume="0.4"></audio>
      <audio id="pn-golpe-100b" class="clip" src="assets/sfx/golpe.wav" data-start="19.43" data-duration="0.35" data-track-index="9" data-volume="0.5"></audio>
      <audio id="sfx-pn-tres1" class="clip" src="assets/sfx/pop-1.wav" data-start="21.17" data-duration="0.09" data-track-index="8" data-volume="0.3"></audio>
      <audio id="sfx-pn-tres2" class="clip" src="assets/sfx/pop-2.wav" data-start="21.25" data-duration="0.09" data-track-index="9" data-volume="0.3"></audio>
      <audio id="sfx-pn-tres3" class="clip" src="assets/sfx/pop-3.wav" data-start="21.33" data-duration="0.09" data-track-index="8" data-volume="0.3"></audio>
      <!-- Plan familiar -->
      <audio id="pf-entra" class="clip" src="assets/sfx/barrido-2.wav" data-start="22.6" data-duration="0.3" data-track-index="7" data-volume="0.3"></audio>
      <audio id="sfx-pf-chip-plan" class="clip" src="assets/sfx/pop-1.wav" data-start="22.71" data-duration="0.09" data-track-index="8" data-volume="0.35"></audio>
      <audio id="sfx-pf-chip-4" class="clip" src="assets/sfx/pop-2.wav" data-start="23.55" data-duration="0.09" data-track-index="9" data-volume="0.35"></audio>
      <audio id="sfx-pf-siluetas" class="clip" src="assets/sfx/pop-3.wav" data-start="23.63" data-duration="0.09" data-track-index="8" data-volume="0.35"></audio>
      <audio id="sfx-pf-tu" class="clip" src="assets/sfx/pop-1.wav" data-start="25.33" data-duration="0.09" data-track-index="9" data-volume="0.35"></audio>
      <audio id="sfx-pf-fam1" class="clip" src="assets/sfx/pop-2.wav" data-start="26.37" data-duration="0.09" data-track-index="8" data-volume="0.35"></audio>
      <audio id="sfx-pf-fam2" class="clip" src="assets/sfx/pop-3.wav" data-start="26.53" data-duration="0.09" data-track-index="9" data-volume="0.35"></audio>
      <audio id="sfx-pf-fam3" class="clip" src="assets/sfx/pop-1.wav" data-start="26.69" data-duration="0.09" data-track-index="8" data-volume="0.35"></audio>
      <audio id="sfx-pf-160" class="clip" src="assets/sfx/pop-2.wav" data-start="29.75" data-duration="0.09" data-track-index="9" data-volume="0.35"></audio>
      <audio id="sfx-pf-bcv" class="clip" src="assets/sfx/pop-3.wav" data-start="30.93" data-duration="0.09" data-track-index="8" data-volume="0.25"></audio>
      <audio id="pf-tachado" class="clip" src="assets/sfx/barrido-1.wav" data-start="31.46" data-duration="0.32" data-track-index="7" data-volume="0.3"></audio>
      <audio id="sfx-pf-30-1" class="clip" src="assets/sfx/pop-1.wav" data-start="35.33" data-duration="0.09" data-track-index="8" data-volume="0.3"></audio>
      <audio id="sfx-pf-30-2" class="clip" src="assets/sfx/pop-2.wav" data-start="35.41" data-duration="0.09" data-track-index="9" data-volume="0.3"></audio>
      <audio id="sfx-pf-30-3" class="clip" src="assets/sfx/pop-3.wav" data-start="35.49" data-duration="0.09" data-track-index="8" data-volume="0.3"></audio>
      <audio id="sfx-pf-30-4" class="clip" src="assets/sfx/pop-1.wav" data-start="35.57" data-duration="0.09" data-track-index="9" data-volume="0.3"></audio>
      <!-- Cierre: acercamiento hacia la mano e impacto con vidrio roto -->
      <audio id="acercamiento" class="clip" src="assets/sfx/acercamiento.wav" data-start="38.77" data-duration="0.45" data-track-index="7" data-volume="0.45"></audio>
      <audio id="impacto" class="clip" src="assets/sfx/impacto.wav" data-start="39.2" data-duration="1.1" data-track-index="9" data-volume="0.7"></audio>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const Z = "#zoom";

      // Cortes de toma (s)
      const CORTES = [2.233, 8.133, 22.133];

      // Toma 1 (sentado): empuje lento y golpe de zoom en "dejar"
      tl.fromTo(Z, { scale: 1 }, { scale: 1.06, duration: 1.4, ease: "sine.inOut" }, 0);
      tl.to(Z, { scale: 1.17, duration: 0.3, ease: "power3.out" }, 1.5);

      // Cada toma nueva entra con un zoom out rápido (va con el swish)
      CORTES.forEach((t) => {
        tl.set(Z, { scale: 1.16 }, t);
        tl.to(Z, { scale: 1, duration: 0.45, ease: "expo.out" }, t);
      });

      // Toma 2: "te MOTIVA más" → zoom in suave, sale, y empuja en "nunca se rendirán"
      tl.to(Z, { scale: 1.12, duration: 0.45, ease: "power2.inOut" }, 3.2);
      tl.to(Z, { scale: 1.0, duration: 0.6, ease: "power2.inOut" }, 4.05);
      tl.to(Z, { scale: 1.08, duration: 1.4, ease: "sine.inOut" }, 5.4);
      tl.to(Z, { scale: 1.2, duration: 0.35, ease: "power3.out" }, 6.95);

      // Toma 3 (plan panitas): punch en cada precio
      tl.to(Z, { scale: 1.14, duration: 0.35, ease: "power3.out" }, 12.2);
      tl.to(Z, { scale: 1.0, duration: 0.6, ease: "power2.inOut" }, 13.85);
      tl.to(Z, { scale: 1.1, duration: 0.35, ease: "power3.out" }, 17.0);
      tl.to(Z, { scale: 1.0, duration: 0.6, ease: "power2.inOut" }, 18.5);
      tl.to(Z, { scale: 1.16, duration: 0.35, ease: "power3.out" }, 19.35);
      tl.to(Z, { scale: 1.03, duration: 0.7, ease: "power2.inOut" }, 20.9);

      // Toma 4 (plan familiar): cámara quieta y suave para que el gráfico respire
      tl.to(Z, { scale: 1.05, duration: 6, ease: "sine.inOut" }, 23.0);
      tl.to(Z, { scale: 1.1, duration: 0.35, ease: "power3.out" }, 33.18);
      tl.to(Z, { scale: 1.03, duration: 0.7, ease: "power2.inOut" }, 34.6);

      // Cierre: "Ya sabes ya" → zoom in, "llévatelo" → zoom out
      tl.to(Z, { scale: 1.18, duration: 0.5, ease: "power3.out" }, 37.5);
      tl.to(Z, { scale: 1.0, duration: 0.5, ease: "power2.inOut" }, 38.25);

      // Golpe a la pantalla: la cámara acelera hacia la mano y tiembla con el impacto
      const IMPACTO = 39.17;
      tl.to(Z, { scale: 1.35, duration: IMPACTO - 38.8, ease: "power3.in" }, 38.8);
      const SACUDIDA = [[-34, 22], [28, -26], [-22, 16], [16, -12], [-10, 8], [6, -4], [0, 0]];
      SACUDIDA.forEach(([x, y], i) => {
        tl.to(Z, { x, y, duration: 0.035, ease: "power1.inOut" }, IMPACTO + i * 0.035);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
