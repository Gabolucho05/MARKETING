  <script>
    const tl = gsap.timeline({ paused: true });
    // Escena empieza en 37.4 s del video
    const L = (t) => t - 37.4;
    const IMPACTO = L(39.17); // la mano de Gabo pega en la cámara

    // "es GABOFIT" → la marca entra de lado con el swish
    tl.fromTo("#cierre-marca",
      { opacity: 0, x: 900, rotation: -6 },
      { opacity: 1, x: 0, rotation: -3, duration: 0.4, ease: "expo.out" }, L(37.6));

    // "LLÉVATELO" → golpe
    tl.fromTo("#cierre-cta",
      { opacity: 0, scale: 1.7 },
      { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, L(38.22));

    // Anticipación: los textos se encogen mientras la mano se acerca
    tl.to("#cierre-caja", { scale: 0.92, duration: 0.3, ease: "power2.in" }, IMPACTO - 0.3);

    // Impacto: los textos salen volando
    tl.to("#cierre-marca", { x: -900, y: -500, rotation: -40, duration: 0.35, ease: "power3.in" }, IMPACTO);
    tl.to("#cierre-cta", { x: 900, y: 450, rotation: 35, duration: 0.35, ease: "power3.in" }, IMPACTO);

    // Flash blanco corto
    tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.85, duration: 0.03, ease: "none" }, IMPACTO);
    tl.to("#flash", { opacity: 0, duration: 0.22, ease: "power2.out" }, IMPACTO + 0.03);

    // Grietas: se dibujan desde el punto del golpe hacia afuera
    tl.set("#grietas", { opacity: 1 }, IMPACTO);
    tl.fromTo("#grietas path",
      { strokeDashoffset: (i, el) => +el.dataset.len },
      { strokeDashoffset: 0, duration: 0.16, ease: "power3.out", stagger: (i) => (i % 78) * 0.004 }, IMPACTO);

    // Placa verde en círculo desde el punto del golpe (tapa el final borroso)
    tl.to("#placa", { clipPath: "circle(150% at 470px 800px)", duration: 0.4, ease: "expo.out" }, IMPACTO + 0.06);
    tl.fromTo("#placa-marca",
      { opacity: 0, scale: 1.7 },
      { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, IMPACTO + 0.14);
    tl.fromTo("#placa-cta",
      { opacity: 0, scale: 0.4, rotation: -8 },
      { opacity: 1, scale: 1, rotation: -3, duration: 0.4, ease: "back.out(2)" }, IMPACTO + 0.36);
    tl.fromTo("#placa-planes",
      { opacity: 0, y: 24 },
      { opacity: 1, y: 0, duration: 0.35, ease: "power4.out" }, IMPACTO + 0.58);

    // La placa y las grietas tiemblan con el golpe
    [[-26, 18], [22, -20], [-16, 12], [10, -8], [-5, 4], [0, 0]].forEach(([x, y], i) => {
      tl.to(["#placa-caja", "#grietas"], { x, y, duration: 0.04, ease: "power1.inOut" }, IMPACTO + 0.06 + i * 0.04);
    });

    // Las grietas se desvanecen y la placa queda limpia
    tl.to("#grietas", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, IMPACTO + 0.9);

    window.__timelines["cierre"] = tl;
  </script>
