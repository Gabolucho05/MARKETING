  <script>
    const tl = gsap.timeline({ paused: true });
    // Esta escena empieza en 8.13 s del video: L(t) pasa tiempo del video a tiempo local
    const L = (t) => t - 8.13;

    const golpe = (sel, t, s) => {
      tl.fromTo(sel, { scale: 1 }, { scale: s, duration: 0.12, ease: "power2.out" }, t);
      tl.to(sel, { scale: 1, duration: 0.3, ease: "power3.out" }, t + 0.12);
    };
    const entra = (sel, t) =>
      tl.fromTo(sel, { opacity: 0, scale: 0.4, y: 30 },
        { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, t);

    // "Si vienes TÚ y DOS PANAS más" → tarjeta + una silueta por persona
    tl.fromTo("#pn-card",
      { opacity: 0, y: 60, scale: 0.92 },
      { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "expo.out" }, L(8.5));
    entra("#pa1", L(8.62));
    tl.fromTo("#pa1 .p-tag", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, L(8.7));
    entra("#pa2", L(9.1));
    entra("#pa3", L(9.3));
    tl.fromTo(["#pa2 .p-tag", "#pa3 .p-tag"], { opacity: 0 },
      { opacity: 1, duration: 0.2, ease: "power2.out", stagger: 0.2 }, L(9.18));

    // "el PLAN PANITAS" → chips del título
    tl.fromTo("#pn-chip-plan",
      { opacity: 0, scale: 1.5 },
      { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, L(10.88));
    tl.fromTo("#pn-chip-3",
      { opacity: 0, scale: 1.5 },
      { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, L(11.22));

    // "por tan solo 100 DÓLARES" → aterriza el precio (con golpe); "A BCV" → etiqueta

      { opacity: 0, scale: 1.8 },
      { opacity: 1, scale: 1, duration: 0.32, ease: "expo.out" }, L(12.26));
    tl.fromTo("#pn-bcv",
      { opacity: 0, y: 10 },
      { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, L(13.2));

    // "en vez de pagar 120" → aparece el precio normal a la izquierda
    tl.fromTo("#pn-viejo",
      { opacity: 0, x: -40 },
      { opacity: 1, x: 0, duration: 0.35, ease: "power4.out" }, L(14.58));

    // "te REBAJAS 20 dólares" → tachado rojo + chip -$20

    tl.to("#pn-viejo", { opacity: 0.45, duration: 0.3, ease: "power2.out" }, L(16.95));
    tl.fromTo("#pn-menos",
      { opacity: 0, scale: 0.3, rotation: -20 },
      { opacity: 1, scale: 1, rotation: -6, duration: 0.35, ease: "back.out(2.2)" }, L(17.08));

    // "terminas pagando 100 DÓLARES AL MES" → el precio vuelve a golpear
    golpe("#pn-nuevo", L(19.4), 1.18);

    // "por los TRES PANITAS" → las tres siluetas saltan en cascada
    ["#pa1", "#pa2", "#pa3"].forEach((p, i) => golpe(p, L(21.14) + i * 0.08, 1.2));

    // Sale antes del cambio de toma
    tl.to("#pn-card", { opacity: 0, scale: 0.9, y: 40, duration: 0.22, ease: "power3.in" }, L(21.75));

    window.__timelines["plan-panitas"] = tl;
