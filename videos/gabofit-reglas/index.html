<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #111111;
      }
      body {
        font-family: "Montserrat", sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="26.3"
      data-width="1080"
      data-height="1920"
    >
      <video
        id="a-roll"
        class="clip"
        src="assets/gabo-reglas.mp4"
        playsinline
        data-start="0"
        data-duration="26.3"
        data-track-index="0"
        data-has-audio="true"
        style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0"
      ></video>

      <!-- Lista de las 5 reglas: aparece en "hay 5 reglas" y avanza con cada regla -->
      <div
        id="reglas"
        class="clip"
        data-composition-id="reglas"
        data-composition-src="compositions/reglas.html"
        data-start="0"
        data-duration="26.3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="position: absolute; inset: 0; z-index: 2"
      ></div>
    </div>

    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
