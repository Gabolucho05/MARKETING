  <style>

  </style>

  <div
    id="root"
    data-composition-id="reglas"
    data-width="1080"
    data-height="1920"
    data-layout-allow-overlap
    data-composition-variables='[
      {"id":"regla1","type":"string","label":"Regla 1","default":"No negociar"},
      {"id":"regla2","type":"string","label":"Regla 2","default":"Deja la flojera"},
      {"id":"regla3","type":"string","label":"Regla 3","default":"Avisa con anticipación"},
      {"id":"regla4","type":"string","label":"Regla 4","default":"Accionar es el primer paso"},
      {"id":"regla5","type":"string","label":"Regla 5","default":"No voy a permitir que te rindas"}
    ]'
  >
    <div id="lista">
      <div id="titulo">
        <span id="tag-reglas" class="tag">5 reglas</span>
        <span id="tag-marca" class="tag">Gabofit</span>
      </div>

      <div class="row" id="r1">
        <div class="badge">
          <div class="b-layer b-pend"></div>
          <div class="b-layer b-done"></div>
          <div class="b-layer b-on"></div>

        </div>
        <div class="pill">
          <div class="p-ring"></div>

          <span class="p-text" data-var-text="regla1">No negociar</span>
        </div>
      </div>

      <div class="row" id="r2">
        <div class="badge">
          <div class="b-layer b-pend"></div>
          <div class="b-layer b-done"></div>
          <div class="b-layer b-on"></div>
          <span class="b-num">2</span>
        </div>
        <div class="pill">
          <div class="p-ring"></div>
          <div class="p-bar"></div>
          <span class="p-text" data-var-text="regla2">Deja la flojera</span>
        </div>
      </div>

      <div class="row" id="r3">
        <div class="badge">
          <div class="b-layer b-pend"></div>
          <div class="b-layer b-done"></div>
          <div class="b-layer b-on"></div>
          <span class="b-num">3</span>
        </div>
        <div class="pill">
          <div class="p-ring"></div>
          <div class="p-bar"></div>
          <span class="p-text" data-var-text="regla3">Avisa con anticipación</span>
        </div>
      </div>

      <div class="row" id="r4">
        <div class="badge">
          <div class="b-layer b-pend"></div>
          <div class="b-layer b-done"></div>
          <div class="b-layer b-on"></div>
          <span class="b-num">4</span>
        </div>
        <div class="pill">
          <div class="p-ring"></div>
          <div class="p-bar"></div>
          <span class="p-text" data-var-text="regla4">Accionar es el primer paso</span>
        </div>
      </div>

      <div class="row" id="r5">
        <div class="badge">
          <div class="b-layer b-pend"></div>
          <div class="b-layer b-done"></div>
          <div class="b-layer b-on"></div>
          <span class="b-num">5</span>
        </div>
        <div class="pill">
          <div class="p-ring"></div>
          <div class="p-bar"></div>
          <span class="p-text" data-var-text="regla5">No voy a permitir que te rindas</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Colores de la marca, leídos de las variables CSS del #root (heredadas por #lista)
    const css = getComputedStyle(document.querySelector("#lista"));
    const C = (name) => css.getPropertyValue(name).trim();
    const NEGRO = C("--negro");
    const BLANCO = C("--blanco");

    // Momentos del audio (s): "hay 5 reglas" y el inicio de cada número que dice Gabo
    const INTRO = 0.99;
    const REGLAS = [3.97, 7.66, 10.17, 13.81, 17.12];
    const AGUANTA = 20.86;

    const rows = [1, 2, 3, 4, 5].map((n) => "#r" + n);
    const all = (sel) => rows.map((r) => r + " " + sel);

    // Intro: "En mi gym hay 5 reglas" → título + los 5 números vacíos
    tl.fromTo("#tag-reglas",
      { opacity: 0, filter: "blur(8px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, INTRO - 0.05);
    tl.fromTo("#tag-marca",
      { opacity: 0, filter: "blur(8px)" },
      { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, INTRO + 0.3);
    tl.fromTo(all(".badge"),
      { opacity: 0, scale: 0.4 },
      { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)", stagger: 0.07 }, INTRO + 0.25);

    // Encender un número (verde, número en negro) con un pequeño golpe de escala
    const encender = (r, t, golpe) => {
      tl.to(r + " .b-on", { opacity: 1, duration: 0.14, ease: "power2.out" }, t);
      tl.to(r + " .b-num", { color: NEGRO, duration: 0.14, ease: "power2.out" }, t);
      tl.to(r + " .badge", { scale: golpe, duration: 0.12, ease: "power2.out" }, t);
      tl.to(r + " .badge", { scale: 1, duration: 0.35, ease: "power3.out" }, t + 0.12);
    };

    // Cada regla: el número se enciende y la etiqueta entra en barrido
    REGLAS.forEach((t, i) => {
      const r = rows[i];
      const on = t - 0.12;

      // la regla anterior pasa a "cumplida" (verde profundo, número en blanco)
      if (i > 0) {
        const prev = rows[i - 1];
        tl.to(prev + " .b-on", { opacity: 0, duration: 0.25, ease: "power2.inOut" }, on);
        tl.to(prev + " .b-num", { color: BLANCO, duration: 0.25, ease: "power2.inOut" }, on);
        tl.to(prev + " .p-ring", { opacity: 0, duration: 0.25, ease: "power2.inOut" }, on);
        tl.to(prev + " .p-bar", { scaleY: 0, duration: 0.25, ease: "power3.in" }, on);
        tl.to(prev + " .p-text", { opacity: 0.8, duration: 0.25, ease: "power2.inOut" }, on);
      }

      tl.to(r + " .b-pend", { opacity: 0, duration: 0.01 }, on + 0.14);
      tl.to(r + " .b-done", { opacity: 1, duration: 0.01 }, on + 0.14);
      encender(r, on, 1.18);

      tl.fromTo(r + " .pill",
        { clipPath: "inset(0% 100% 0% 0% round 16px)" },
        { clipPath: "inset(0% 0% 0% 0% round 16px)", duration: 0.55, ease: "expo.out" }, on + 0.04);
      tl.fromTo(r + " .p-bar",
        { scaleY: 0 },
        { scaleY: 1, duration: 0.3, ease: "power3.out" }, on + 0.04);
      tl.fromTo(r + " .p-ring",
        { opacity: 0 },
        { opacity: 1, duration: 0.2, ease: "power2.out" }, on + 0.1);
      tl.fromTo(r + " .p-text",
        { x: -24, filter: "blur(6px)" },
        { x: 0, filter: "blur(0px)", duration: 0.4, ease: "power4.out" }, on + 0.08);
    });

    // "Aguanta las reglas": las 5 se encienden juntas en cascada y se quedan
    const fin = AGUANTA - 0.1;
    tl.to("#r5 .p-ring", { opacity: 0, duration: 0.15, ease: "power2.in" }, fin - 0.15);
    rows.forEach((r, i) => {
      const t = fin + i * 0.08;
      encender(r, t, 1.14);
      tl.to(r + " .p-text", { opacity: 1, duration: 0.2, ease: "power2.out" }, t);
      tl.to(r + " .p-bar", { scaleY: 1, duration: 0.3, ease: "power3.out" }, t);
    });

    window.__timelines["reglas"] = tl;
  </script>
