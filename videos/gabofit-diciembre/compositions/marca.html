<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      font-family: "Montserrat", sans-serif;
      --negro: #111111;
      --verde: #0aa061; /* verde del logo GABOFIT */
      --blanco: #ffffff;
    }
    /* Arriba a la izquierda, debajo de la barra de la app (zona segura de TikTok / Reels) */
    #marca {
      position: absolute;
      left: 56px;
      top: 196px;
      display: flex;
      align-items: center;
      opacity: 0;
    }
    /* Logo real sobre placa blanca: las partes negras del logo no se pierden en el video */
    #logo {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 12px;
      height: 92px;
      padding: 0 22px 0 16px;
      border-radius: 22px;
      background: var(--blanco);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }
    #logo-g {
      display: block;
      height: 62px;
      width: auto;
    }
    #logo-texto {
      display: block;
      height: 34px;
      width: auto;
    }
    #pt {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      height: 66px;
      margin-left: -22px;
      padding: 0 26px 0 44px;
      border-radius: 0 18px 18px 0;
      background: var(--verde);
      color: var(--blanco);
      font-size: 32px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
      clip-path: inset(0% 100% 0% 0%);
    }
  </style>

  <div
    id="root"
    data-composition-id="marca"
    data-width="1080"
    data-height="1920"
    data-layout-allow-overlap
    data-composition-variables='[
      {"id":"etiqueta","type":"string","label":"Etiqueta","default":"Personal trainer"}
    ]'
  >
    <div id="marca">
      <div id="logo">
        <img id="logo-g" src="assets/logos/gabofit-g.png" alt="" />
        <img id="logo-texto" src="assets/logos/gabofit-texto.png" alt="GABOFIT" />
      </div>
      <div id="pt"><span id="pt-texto" data-var-text="etiqueta">Personal trainer</span></div>
    </div>
  </div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const FIN = 36.6; // duración de esta escena (hasta el golpe)

    // Entrada del logo
    tl.fromTo("#marca", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 0.15);

    // "PERSONAL TRAINER" abre y cierra en ciclos de 5 s durante todo el video
    // (ciclos escritos uno por uno: el timeline debe ser finito y buscable)
    const CICLO = 5.0;
    for (let t = 0.45; t + 1.2 < FIN; t += CICLO) {
      tl.to("#pt", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "expo.out" }, t);
      tl.fromTo("#pt-texto", { x: -30 }, { x: 0, duration: 0.45, ease: "expo.out" }, t);
      const cierra = Math.min(t + 3.4, FIN - 0.5);
      tl.to("#pt", { clipPath: "inset(0% 100% 0% 0%)", duration: 0.35, ease: "power3.in" }, cierra);
      // la G da un pequeño giro cuando la etiqueta se guarda
      tl.fromTo("#logo-g", { rotation: 0 }, { rotation: -8, duration: 0.1, ease: "power2.out" }, cierra + 0.33);
      tl.to("#logo-g", { rotation: 0, duration: 0.3, ease: "power3.out" }, cierra + 0.43);
    }

    window.__timelines["marca"] = tl;
  </script>
</template>
