          <path class="d" pathLength="1" d="M100 14 C116 56 166 82 160 146 C156 198 128 226 100 226 C64 226 34 198 34 150 C34 108 66 92 72 52 C88 80 92 96 98 110 C106 86 112 50 100 14 Z" />

        <div class="cd-chispa" id="cd2-s1" style="left: 120px; top: 150px"></div>

  <script>
    const tl = gsap.timeline({ paused: true });

    // Estados iniciales que GSAP luego anima (no en CSS, para que no choquen)
    tl.set([".barra-fill", "#mt-progreso"], { scaleX: 0 }, 0);
    tl.set(".mk-barra", { skewX: -38, scaleX: 0 }, 0);
    tl.set(".mascara > span", { yPercent: 110 }, 0);
    tl.set("#mj-t2", { yPercent: 110, opacity: 0 }, 0);
    tl.set("#mj-t1", { yPercent: 110 }, 0);

    // ---------- Utilidades ----------
    const entra = (sel, t) => {
      tl.fromTo(sel, { opacity: 0, y: 70, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "expo.out" }, t);
      tl.fromTo(sel + " .acento", { scaleY: 0 }, { scaleY: 1, duration: 0.45, ease: "expo.out" }, t + 0.08);
      tl.fromTo(sel + " .etq", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, t + 0.12);
    };
    const sale = (sel, t) => tl.to(sel, { opacity: 0, y: 40, scale: 0.95, duration: 0.26, ease: "power3.in" }, t);
    const dibuja = (sel, t, dur = 0.5, stagger = 0.06) =>
      tl.fromTo(sel, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur, ease: "power2.inOut", stagger }, t);
    const revela = (sel, t) => tl.to(sel, { yPercent: 0, duration: 0.42, ease: "expo.out" }, t);
    const brillo = (sel, t) => tl.fromTo(sel, { xPercent: 0 }, { xPercent: 640, duration: 0.8, ease: "power2.inOut" }, t);
    const cuenta = (el, t, a, b, dur, fmt) => {
      const o = { v: a };
      tl.to(o, { v: b, duration: dur, ease: "power2.out", onUpdate: () => { document.querySelector(el).textContent = fmt(o.v); } }, t);
    };
    const golpe = (sel, t, s = 1.1) => {
      tl.to(sel, { scale: s, duration: 0.1, ease: "power2.out" }, t);
      tl.to(sel, { scale: 1, duration: 0.3, ease: "power3.out" }, t + 0.1);
    };
    // aparece y luego se va (sin quedar visible antes de tiempo)
    const destello = (sel, t, a, b, dur) => {
      tl.fromTo(sel, { opacity: 0 }, { opacity: a.opacity ?? 1, duration: 0.04, ease: "none" }, t);
      tl.fromTo(sel, { ...a }, { ...b, duration: dur, ease: "power2.out", immediateRender: false }, t + 0.04);
    };
    const chispasLlama = (ids, t) => ids.forEach((s, i) =>
      destello(s, t + i * 0.09, { opacity: 1, y: 0, x: 0, scale: 1 }, { opacity: 0, y: -170 - i * 20, x: (i % 2 ? 30 : -30), scale: 0.3 }, 0.75));

    // A · "ponerte FUERTE" → la fuerza sube a 100 %; "para DICIEMBRE" → meta
    entra("#p-fuerza", 4.14);
    dibuja("#p-fuerza .d", 4.2, 0.45);
    tl.to("#fz-fill", { scaleX: 1, duration: 0.85, ease: "power2.inOut" }, 4.3);
    cuenta("#fz-num", 4.3, 0, 100, 0.85, (v) => Math.round(v) + "%");
    golpe("#fz-num", 4.6, 1.12);
    brillo("#fz-brillo", 4.62);
    tl.fromTo("#fz-meta", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, 5.28);
    sale("#p-fuerza", 5.9);

    // C · "lucir ese OUTFIT CANDELA" → la camiseta se dibuja y brilla
    entra("#p-outfit", 6.0);
    dibuja("#p-outfit .d", 6.06, 0.55, 0.12);
    revela("#of-t", 6.64);
    ["#of-c1", "#of-c2", "#of-c3", "#of-c4"].forEach((c, i) =>
      tl.fromTo(c, { opacity: 0, scale: 0, rotation: -90 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.5)" }, 6.66 + i * 0.07));
    brillo("#of-brillo", 6.68);
    sale("#p-outfit", 7.28);

    // D · "ir para la PLAYITA" → amanece en la playa
    entra("#p-playa", 7.36);
    tl.fromTo("#pl-sol", { y: 140 }, { y: 0, duration: 0.8, ease: "power3.out" }, 7.6);
    tl.fromTo("#pl-olas", { x: 0 }, { x: -210, duration: 1.3, ease: "none" }, 7.36);
    revela("#pl-t", 7.66);
    tl.fromTo("#pl-chip", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 7.9);
    sale("#p-playa", 8.3);

    // E · "el cuerpito CANDELA" → la llama se dibuja, se llena y suelta chispas
    entra("#p-candela", 8.36);
    dibuja("#p-candela .d", 8.42, 0.4);
    revela("#cd-t", 8.72);
    tl.fromTo("#cd-nivel", { attr: { y: 250 } }, { attr: { y: 0 }, duration: 0.6, ease: "power2.out" }, 8.72);
    tl.to("#cd-fill", { scaleX: 1, duration: 0.7, ease: "power2.out" }, 8.74);
    chispasLlama(["#cd-s1", "#cd-s2", "#cd-s3", "#cd-s4"], 8.9);
    sale("#p-candela", 9.7);

    // F · "tienes que ENTRENAR" ×2 → contador de repeticiones con anillo
    entra("#p-reps", 10.6);
    tl.to("#rp-arco", { strokeDashoffset: 0.5, duration: 0.4, ease: "power3.out" }, 10.8);
    tl.set("#rp-num", { textContent: "1" }, 10.8);
    golpe("#rp-num", 10.8, 1.25);
    tl.to("#rp-arco", { strokeDashoffset: 0, duration: 0.4, ease: "power3.out" }, 12.22);
    tl.set("#rp-num", { textContent: "2" }, 12.22);
    golpe("#rp-num", 12.22, 1.25);
    sale("#p-reps", 12.95);

    // G · "con el MEJOR" → escudo #1; "con GABOFIT" → el #1 se vuelve la G de la marca
    entra("#p-mejor", 13.2);
    dibuja("#mj-escudo .d", 13.28, 0.5);
    tl.fromTo("#mj-uno", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 13.66);
    tl.to("#mj-t1", { yPercent: 0, duration: 0.42, ease: "expo.out" }, 13.66);
    tl.to("#mj-uno", { opacity: 0, scaleX: 0, duration: 0.14, ease: "power2.in" }, 14.34);
    tl.fromTo("#mj-g", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "back.out(2)" }, 14.46);
    tl.to("#mj-t1", { yPercent: -110, opacity: 0, duration: 0.25, ease: "power3.in" }, 14.3);
    tl.to("#mj-t2", { yPercent: 0, opacity: 1, duration: 0.42, ease: "expo.out" }, 14.42);
    brillo("#mj-brillo", 14.46);
    sale("#p-mejor", 15.2);

    // H · "estamos en TEMPORADA ALTA" → gráfica que sube
    entra("#p-temporada", 15.62);

    dibuja("#p-temporada .d.v", 15.98, 0.6, 0.45);
    tl.fromTo("#tp-punto", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, 16.6);
    sale("#p-temporada", 17.0);

    // I · "empezando NOVIEMBRE ... para DICIEMBRE" → el cursor viaja de NOV a DIC
    entra("#p-meta", 17.06);
    tl.fromTo("#mt-cursor", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, 17.18);
    tl.fromTo("#mt-cursor", { x: 0 }, { x: 672, duration: 2.1, ease: "power1.inOut" }, 17.24);
    tl.to("#mt-progreso", { scaleX: 1, duration: 2.1, ease: "power1.inOut" }, 17.24);
    tl.to("#mt-mes-nov", { color: "rgba(255,255,255,0.62)", duration: 0.3 }, 18.6);
    tl.to("#mt-dic-on", { opacity: 1, duration: 0.15 }, 19.34);
    tl.to("#mt-mes-dic", { color: "#19d37f", duration: 0.15 }, 19.34);
    golpe("#mt-mes-dic", 19.34, 1.25);
    destello("#mt-onda", 19.34, { opacity: 1, scale: 1 }, { opacity: 0, scale: 3 }, 0.6);
    sale("#p-meta", 20.4);

    // J · "una BOLITA ... ni un FLAQUITO" → cada figura se dibuja y se tacha
    entra("#p-no", 21.26);
    dibuja("#no-c1 .d:not(.r)", 21.36, 0.4);
    tl.fromTo("#no-t1", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, 21.54);
    dibuja("#no-c1 .d.r", 21.62, 0.3);
    dibuja("#no-c2 .d:not(.r)", 22.56, 0.35);
    tl.fromTo("#no-t2", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, 22.9);
    dibuja("#no-c2 .d.r", 22.96, 0.3);
    sale("#p-no", 23.5);

    // K · "vengan a entrenar con GABOFIT" → barras diagonales de la G y el logo
    tl.set("#mk", { opacity: 1 }, 25.45);
    tl.to("#mk-b1", { scaleX: 1, duration: 0.35, ease: "expo.out" }, 25.5);
    tl.to("#mk-b2", { scaleX: 1, duration: 0.35, ease: "expo.out" }, 25.58);
    tl.fromTo("#mk-logo", { opacity: 0, scale: 0.6, rotation: -6 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2)" }, 25.74);
    tl.to(["#mk-b1", "#mk-b2"], { x: 520, opacity: 0, duration: 0.3, ease: "power3.in" }, 25.9);
    tl.to("#mk", { opacity: 0, scale: 0.92, duration: 0.22, ease: "power3.in" }, 26.36);

    // L · "40 DÓLARES a BCV" → el precio cuenta hasta $40; checks se dibujan; sello INCLUIDO
    tl.fromTo("#precio", { opacity: 0, y: 60, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "expo.out" }, 26.56);
    tl.fromTo("#precio .acento", { scaleY: 0 }, { scaleY: 1, duration: 0.45, ease: "expo.out" }, 26.62);
    cuenta("#precio-num", 26.62, 0, 40, 0.5, (v) => "$" + Math.round(v));
    tl.fromTo("#precio-bcv", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 27.56);
    tl.fromTo("#bcv-sello", { rotation: -180, scale: 0.3 }, { rotation: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 27.56);
    [["#inc1", 28.54], ["#inc2", 29.42], ["#inc3", 30.46]].forEach(([sel, t]) => {
      tl.fromTo(sel, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.3, ease: "power4.out" }, t);
      tl.fromTo(sel + " .check", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, t + 0.03);
      dibuja(sel + " .d", t + 0.1, 0.25);
    });
    tl.to("#precio-bcv", { opacity: 0, y: -10, duration: 0.15, ease: "power2.in" }, 30.9);
    tl.fromTo("#sello", { opacity: 0, scale: 2.4, rotation: -4 }, { opacity: 1, scale: 1, rotation: -10, duration: 0.25, ease: "power4.in" }, 31.04);
    brillo("#precio-brillo", 31.1);
    tl.to("#precio", { opacity: 0, scale: 0.94, y: 40, duration: 0.24, ease: "power3.in" }, 31.95);

    // M · "deja de perder TIEMPO" → cronómetro que se vacía y se pone rojo
    entra("#p-tiempo", 32.26);
    dibuja("#p-tiempo .d", 32.32, 0.35);
    revela("#ti-t", 32.84);
    tl.to("#ti-arco", { strokeDashoffset: 1, duration: 0.95, ease: "none" }, 32.42);
    tl.to("#ti-arco", { stroke: "#ef4444", duration: 0.4, ease: "none" }, 32.8);
    tl.fromTo("#ti-aguja", { rotation: 0 }, { rotation: 360, svgOrigin: "100 104", duration: 0.95, ease: "none" }, 32.42);
    tl.to("#ti-fill", { scaleX: 1, duration: 0.95, ease: "none" }, 32.42);
    sale("#p-tiempo", 33.36);

    // N · "LLÉGATE para acá" → el pin cae en el mapa y emite ondas
    entra("#p-llegate", 33.4);
    dibuja("#lg-calles .d", 33.44, 0.4);
    tl.fromTo("#lg-pin", { opacity: 0, y: -160 }, { opacity: 1, y: 0, duration: 0.5, ease: "bounce.out" }, 33.5);
    revela("#lg-t", 33.6);
    ["#lg-o1", "#lg-o2", "#lg-o3"].forEach((o, i) => destello(o, 33.86 + i * 0.18, { opacity: 0.9, scale: 0.4 }, { opacity: 0, scale: 3.4 }, 0.8));
    tl.fromTo("#lg-chip", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 33.95);
    sale("#p-llegate", 34.6);

    // O · "ese cuerpito CANDELA para DICIEMBRE" → llama final
    entra("#p-candela2", 34.9);
    dibuja("#p-candela2 .d", 34.96, 0.4);
    tl.fromTo("#cd2-nivel", { attr: { y: 250 } }, { attr: { y: 0 }, duration: 0.6, ease: "power2.out" }, 35.32);
    revela("#cd2-t", 35.96);
    chispasLlama(["#cd2-s1", "#cd2-s2", "#cd2-s3", "#cd2-s4"], 35.5);
    sale("#p-candela2", 36.36);

    window.__timelines["acciones"] = tl;
  </script>
