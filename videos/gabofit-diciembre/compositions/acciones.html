  <script>
    const tl = gsap.timeline({ paused: true });

    // Utilidades: un sticker entra con giro, y sale encogiéndose
    const entra = (sel, t, rot = -14) =>
      tl.fromTo(sel, { opacity: 0, scale: 0.2, rotation: rot },
        { opacity: 1, scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.2)" }, t);
    const sale = (sel, t) =>
      tl.to(sel, { opacity: 0, scale: 0.4, duration: 0.18, ease: "power3.in" }, t);
    const golpe = (sel, t, s = 1.18) => {
      tl.to(sel, { scale: s, duration: 0.1, ease: "power2.out" }, t);
      tl.to(sel, { scale: 1, duration: 0.28, ease: "power3.out" }, t + 0.1);
    };

    // "si tú quieres PONERTE FUERTE" → la mancuerna sube y baja dos veces (una repetición)
    entra("#pesa1", 4.18);
    tl.to("#pesa1 .pesa-g", { y: -26, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 3, transformOrigin: "50% 50%" }, 4.56);
    sale("#pesa1", 5.25);

    // "OUTFIT CANDELA" → llama
    entra("#llama1", 6.62, 10);
    tl.to("#llama1 svg", { scaleY: 1.1, duration: 0.12, ease: "sine.inOut", yoyo: true, repeat: 3, transformOrigin: "50% 100%" }, 6.8);

    // "ir para la PLAYITA" → sol (los rayos giran) y olas
    entra("#playa", 7.62);
    tl.to("#sol-rayos", { rotation: 45, svgOrigin: "100 80", duration: 1.0, ease: "power1.inOut" }, 7.7);

    // "el cuerpito CANDELA" → llama

    // "tienes que ENTRENAR, y tienes que ENTRENAR" → mancuerna, una repetición en cada "entrenar"
    entra("#pesa2", 10.76);
    tl.to("#pesa2 .pesa-g", { y: -30, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, 10.85);
    tl.to("#pesa2 .pesa-g", { y: -30, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, 12.24);
    sale("#pesa2", 12.95);

    // "empezando NOVIEMBRE ... para DICIEMBRE" → el calendario pasa de NOV a DIC
    tl.fromTo("#cal", { opacity: 0, y: 40, rotation: 8 }, { opacity: 1, y: 0, rotation: 0, duration: 0.4, ease: "back.out(2)" }, 17.14);

    tl.to("#cal-nov", { yPercent: -160, duration: 0.3, ease: "power3.in" }, 19.3);
    tl.to("#cal-dic", { yPercent: 0, duration: 0.35, ease: "back.out(2)" }, 19.36);
    golpe("#cal", 19.36, 1.12);
    tl.to("#cal", { opacity: 0, y: -30, duration: 0.2, ease: "power3.in" }, 20.4);

    // "40 DÓLARES a BCV" → precio; "con GIMNASIO, MENSUALIDAD y ENTRENADOR PERSONAL" → checks; "INCLUIDO" → sello
    tl.fromTo("#precio", { opacity: 0, y: 60, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "expo.out" }, 26.6);
    tl.fromTo("#precio-num", { scale: 1.8 }, { scale: 1, duration: 0.32, ease: "expo.out", transformOrigin: "0% 70%" }, 26.62);
    tl.fromTo("#precio-bcv", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 27.56);
    tl.fromTo("#bcv-sello", { rotation: -180, scale: 0.3 }, { rotation: 0, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 27.56);
    [["#inc1", 28.54], ["#inc2", 29.42], ["#inc3", 30.46]].forEach(([sel, t]) => {
      tl.fromTo(sel, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.3, ease: "power4.out" }, t);
      tl.fromTo(sel + " .check", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.5)" }, t + 0.05);
    });
    tl.to("#precio-bcv", { opacity: 0, y: -10, duration: 0.15, ease: "power2.in" }, 30.9);
    tl.fromTo("#sello", { opacity: 0, scale: 2.4, rotation: -4 }, { opacity: 1, scale: 1, rotation: -10, duration: 0.25, ease: "power4.in" }, 31.04);
