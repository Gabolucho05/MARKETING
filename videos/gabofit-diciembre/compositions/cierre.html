  <script>
    const tl = gsap.timeline({ paused: true });
    // La escena empieza 0.2 s antes del golpe; IMPACTO = momento en que la mano tapa la cámara
    const IMPACTO = 0.2;

    // Flash blanco corto
    tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.85, duration: 0.03, ease: "none" }, IMPACTO);
    tl.to("#flash", { opacity: 0, duration: 0.22, ease: "power2.out" }, IMPACTO + 0.03);

    // Grietas: se dibujan desde el punto del golpe hacia afuera
    tl.set("#grietas", { opacity: 1 }, IMPACTO);
    tl.fromTo("#grietas path",
      { strokeDashoffset: (i, el) => +el.dataset.len },
      { strokeDashoffset: 0, duration: 0.16, ease: "power3.out", stagger: (i) => (i % 75) * 0.004 }, IMPACTO);

    // Placa verde en círculo desde el punto del golpe
    tl.to("#placa", { clipPath: "circle(150% at 360px 760px)", duration: 0.4, ease: "expo.out" }, IMPACTO + 0.05);

    // La placa y las grietas tiemblan con el golpe
    [[-26, 18], [22, -20], [-16, 12], [10, -8], [-5, 4], [0, 0]].forEach(([x, y], i) => {
      tl.to(["#placa-caja", "#grietas"], { x, y, duration: 0.04, ease: "power1.inOut" }, IMPACTO + 0.05 + i * 0.04);
    });

    // Contenido de la placa, en cascada
    tl.fromTo("#placa-logo", { opacity: 0, scale: 1.7 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, IMPACTO + 0.12);
    tl.fromTo("#placa-pt", { opacity: 0, scaleX: 1.6 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "expo.out" }, IMPACTO + 0.32);
    tl.fromTo("#placa-cta", { opacity: 0, scale: 0.4, rotation: -8 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.4, ease: "back.out(2)" }, IMPACTO + 0.55);
    tl.fromTo("#placa-oferta", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.35, ease: "power4.out" }, IMPACTO + 0.75);

    // Las grietas se desvanecen y la placa queda limpia
    tl.to("#grietas", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, IMPACTO + 0.9);

    window.__timelines["cierre"] = tl;
  </script>
