      const IMPACTO = 36.63;
      const [t0, s0, x0, y0] = CAM[CAM.length - 1];
      const P = [360, 760], s1 = 1.55;
      tl.to(Z, {
        scale: s1,
        x: P[0] - s1 * ((P[0] - x0) / s0),
        y: P[1] - s1 * ((P[1] - y0) / s0),
        duration: IMPACTO - t0,
        ease: "power3.in",
      }, t0);

      window.__timelines["main"] = tl;
    </script>
