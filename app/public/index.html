<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agencia 360 — Chat</title>
<style>
  :root {
    --accent: #96590F;
    --accent-strong: #7A480A;
    --dept-estrategia: #0D8C79;
    --dept-diseno: #B3563A;
    --dept-digital: #2F5FA3;
    --dept-analitica: #A98424;
    --bg: #F1EDE3;
    --surface: #FFFFFF;
    --surface-2: #FAF6EC;
    --border: #E3DDCC;
    --text: #1F1B15;
    --text-2: #5B5548;
    --text-3: #8B8577;
    --font-display: "Iowan Old Style", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
    --font-body: Optima, Candara, "Noto Sans", "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #E3A24B; --accent-strong: #F0B565;
      --dept-estrategia: #16A38C; --dept-diseno: #C96A46; --dept-digital: #4C7AC6; --dept-analitica: #B08429;
      --bg: #16130E; --surface: #201B14; --surface-2: #241F17; --border: #332C20;
      --text: #F3EFE6; --text-2: #C9C2B2; --text-3: #8F8975;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  body { display: flex; flex-direction: column; }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-shrink: 0;
  }
  header .brand { font-family: var(--font-display); font-size: 1.3rem; }
  header .brand strong { color: var(--accent); }
  header .sub { font-size: 0.8rem; color: var(--text-3); }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 3px; }
  .msg.assistant { align-self: flex-start; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); border-bottom-left-radius: 3px; }
  .msg.tool-note {
    align-self: flex-start;
    font-family: var(--font-mono);
    font-size: 0.76rem;
    color: var(--text-3);
    background: var(--surface-2);
    padding: 6px 10px;
    border-radius: 8px;
  }
  .msg.error { align-self: center; color: #B23B3B; font-size: 0.85rem; }

  footer {
    border-top: 1px solid var(--border);
    padding: 16px 24px 20px;
    flex-shrink: 0;
  }
  form {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
  }
  textarea {
    flex: 1;
    resize: none;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    padding: 12px 14px;
    min-height: 48px;
    max-height: 160px;
  }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    font: inherit;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint { text-align: center; font-size: 0.74rem; color: var(--text-3); margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <span class="brand"><strong>AGENCIA</strong> 360</span>
    <span class="sub">chat independiente · powered by la API de Claude</span>
  </header>
  <main id="log"></main>
  <footer>
    <form id="form">
      <textarea id="input" placeholder="Escríbele a la agencia... (ej. 'crea el expediente de ManoTv y arma el brief de lanzamiento de agosto')" rows="1"></textarea>
      <button id="send" type="submit">Enviar</button>
    </form>
    <div class="hint">Sin conectores en vivo a plataformas externas — produce planes, briefs y reportes, y los guarda en <code>clientes/</code>.</div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
